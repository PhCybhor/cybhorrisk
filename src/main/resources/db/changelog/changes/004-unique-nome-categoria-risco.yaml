databaseChangeLog:
  - changeSet:
      id: 004-01-unique-nome-normalizado-categoria-risco
      author: curso-spring-2026
      comment: Garante no PostgreSQL a unicidade do nome da categoria sem diferenciar maiúsculas.
      changes:
        - sql:
            sql: >
              CREATE UNIQUE INDEX uk_categoria_risco_nome_lower
              ON categoria_risco (LOWER(BTRIM(nome)))
      rollback:
        - sql:
            sql: >
              DROP INDEX uk_categoria_risco_nome_lower
